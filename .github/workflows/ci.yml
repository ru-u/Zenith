name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Catch advisories published against dependencies that haven't changed —
  # a clean audit on Monday says nothing about Thursday.
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs exactly the lockfile and fails if package.json and
      # the lockfile disagree — the difference between shipping the tree you
      # reviewed and whatever npm resolved this morning.
      - run: npm ci

      - run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build-time only. NEXT_PUBLIC_* values are inlined into the bundle,
          # so these are placeholders that let the build resolve — never real
          # credentials, and nothing here reaches a deploy.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://zenithscreener.com

  # Its OWN job, deliberately not a step inside `verify`.
  #
  # It used to run second in `verify`, ahead of lint/typecheck/build. On
  # 2026-09-08 two critical advisories were published against the pinned
  # `next` — a dependency nobody had touched — and the job died at 24s, so
  # lint, typecheck and build never ran on the two commits that had just
  # landed. A red X said "something is wrong" while hiding whether the code
  # even compiled, which is the one thing CI is for.
  #
  # These are different signals with different owners: `verify` failing means
  # somebody's code is broken and the fix is in the diff. `audit` failing
  # usually means the world changed under a version nobody edited, and the fix
  # is a maintenance decision. Neither should be able to mask the other, so
  # they run in parallel and fail independently. That the weekly `schedule`
  # above exists at all is the same admission — a clean audit on Monday says
  # nothing about Thursday.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — a secret deleted in a later commit is still a leaked secret

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
